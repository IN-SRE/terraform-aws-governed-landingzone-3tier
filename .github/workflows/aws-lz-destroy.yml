name: "aws-lz-plan-Manual Destroy"

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Select Environment to Destroy'
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy ${{ github.event.inputs.env }}
    runs-on: ubuntu-latest
    # This ensures it still waits for approval on Stage/Prod
    environment: ${{ github.event.inputs.env }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::245111010647:role/github-terraform-dev-role
          aws-region: us-east-1

      - name: Terraform Install
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Terraform Init
        working-directory: global-aws-landing-zones
        run: |
          terraform init \
            -backend-config="backend.config" \
            -backend-config="key=aws-lz/terraform.tfstate"

      - name: Terraform Destroy
        working-directory: global-aws-landing-zones
        run: |
          terraform destroy -auto-approve 
