name: "aws-lz-state-rm-Manual"

on:
  workflow_dispatch:
    inputs:
      resource_address:
        description: 'Exact resource address to remove (e.g., module.lz.aws_vpc.main)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  state_rm:
    name: State RM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          # Dynamically assumes the correct role based on the selected environment input
          role-to-assume: arn:aws:iam::245111010647:role/github-terraform-dev-role
          aws-region: us-east-1

      - name: Terraform Install
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5

      - name: Terraform init
        working-directory: global-aws-landing-zones
        run: |
          terraform init \
            -backend-config="backend.config" \
            -backend-config="key=aws-lz/terraform.tfstate"

      - name: Terraform State RM
        working-directory: global-aws-landing-zones
        run: |
          terraform state rm "${{ github.event.inputs.resource_address }}"
