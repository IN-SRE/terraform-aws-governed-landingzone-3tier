name: "AWS LZ Apply"

on:
  push:
    branches: [main]
    paths: ["global-aws-landing-zones/**"]

# Required for OIDC and PR interaction
permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    name: Apply Prod
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::245111010647:role/github-terraform-dev-role
          aws-region: us-east-1
          
      - name: Terraform install
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Terraform Init & Apply
        working-directory: global-aws-landing-zones
        run: |
          terraform init \
          -backend-config="../backend.config" \
          -backend-config="aws-lz/terraform.tfstate"
          
      - name: Terraform Apply
        working-directory: global-aws-landing-zones
        run: terraform apply -auto-approve 
       
 