name: Terraform AWS CD
on:
  push:
    branches: [main]
    paths: ["workloads/envs/**"]

permissions:
  id-token: write
  contents: read
    
    
jobs:
  deploy-dev:
    name: apply dev
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::630898854601:role/Workloadaws
          aws-region: us-east-1

      - name: Terraform install
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - name: Terraform Init & Apply
        working-directory: workloads/envs/dev
        run: |
          terraform init \
          -backend-config="backend.config" \
          -backend-config="key=workloads/dev/terraform.tfstate"
          
      - name: Terraform Apply
        working-directory: workloads/envs/dev
        run: terraform apply -auto-approve -var-file="dev.tfvars"

  deploy-stage:
    name: Apply Stage
    needs: deploy-dev   # <--- STOP CIRCUIT: Only runs if dev succeeds
    environment: stage  # stop wait for QA lead approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::630898854601:role/Workloadaws
          aws-region: us-east-1
          
      - name: Terraform install
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - name: Terraform Init
        working-directory: workloads/envs/stage
        run: |
          terraform init \
          -backend-config="backend.config" \
          -backend-config="key=workloads/stage/terraform.tfstate"
      
      - name: Terraform Apply
        working-directory: workloads/envs/stage
        run: terraform apply -auto-approve -var-file="stage.tfvars"
          

  deploy-prod:
    name: Apply Prod
    needs: deploy-stage # <--- FINAL GATE: Only reached if Dev, QA, and Stage pass
    environment: prod   # Gated by Manual Approval in GitHub Settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::630898854601:role/Workloadaws
          aws-region: us-east-1
          
      - name: Terraform install
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - name: Terraform Init & Apply
        working-directory: workloads/envs/prod
        run: |
          terraform init \
          -backend-config="backend.config" \
          -backend-config="key=workloads/prod/terraform.tfstate"

      - name: Terraform Apply
        working-directory: workloads/envs/prod
        run: terraform apply -auto-approve -var-file="prod.tfvars"     