name: Terraform AWS CD
on:
  push:
    branches: [dev, stage, main]
    paths: ["workloads/envs/**"]

permissions:
  id-token: write
  contents: read
    
    
jobs:
  deploy:
    name: apply ${{ github.base_ref == 'main' && 'prod' || github.base_ref }}
    env:
      ENV_NAME: ${{ github.base_ref == 'main' && 'prod' || github.base_ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform install
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - name: Terraform Init & Apply
        working-directory: workloads/envs/${{ env.ENV_NAME }}
        run: |
          terraform init \
          -backend-config="backend.config" \
          -backend-config="key=workloads/${{ env.ENV_NAME }}/terraform.tfstate"
          
      - name: Terraform Apply
        working-directory: workloads/envs/${{ env.ENV_NAME }}
        run: terraform apply -auto-approve -var-file="${{ env.ENV_NAME }}.tfvars"

